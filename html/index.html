<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tester Live Futbol</title>
    <script src="../js/nombresEquipos.js"></script>
    <script src="../js/calendarioLigas.js"></script>
    <script src="../js/simulador.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilosTabla.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        oswald: ["Oswald", "sans-serif"],
                    },
                },
            },
        };
    </script>
</head>

<body class="bg-slate-900 text-gray-100 font-oswald min-h-screen">

    <header class="text-center py-8 bg-slate-800 shadow-md mb-8 border-b-4">
        <h1 class="text-4xl font-bold uppercase tracking-wider text-white"></h1>
    </header>

    <main class="flex flex-col lg:flex-row gap-10 px-8 max-w-7xl mx-auto items-start">

        <!-- Contenedor con tabla y resultados -->

        <!-- Contenedor Izquierdo (Clasificación) -->
        <section class="w-full lg:w-1/2 bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
            <!-- Tabla y calculadora de jornadas -->
            <div class="tabla-clasificacion">
                <table class="tabla-clasificacion">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th></th>
                            <th>Equipo</th>
                            <th>P. Jug</th>
                            <th>V</th>
                            <th>E</th>
                            <th>D</th>
                            <th>GF</th>
                            <th>GC</th>
                            <th>DG</th>
                            <th>Ptos.</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-clasificacion">

                    </tbody>
                </table>
            </div>
        </section>

        <!-- Contenedor Derecho (Calendario y Botones) -->
        <section
            class="w-full lg:w-1/2 bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 flex flex-col gap-6">
            <!-- Jornadas -->
            <div class="calendario">
                <div id="contenedor-jornadas">

                </div>
                <!-- Botones -->
                <div class="botones flex justify-center gap-4 mt-8 pt-6 border-t border-slate-700">
                    <input type="button" value="<<"
                        class="bg-slate-700 text-white font-bold py-2 px-6 rounded cursor-pointer transition-colors duration-300 hover:bg-red-700" />
                    <input type="button" value="Calcular"
                        class="bg-slate-700 text-white font-bold py-2 px-6 rounded cursor-pointer transition-colors duration-300 hover:bg-red-700" />
                    <input type="button" value="Reset"
                        class="bg-slate-700 text-white font-bold py-2 px-6 rounded cursor-pointer transition-colors duration-300 hover:bg-red-700" />
                    <input type="button" value=">>"
                        class="bg-slate-700 text-white font-bold py-2 px-6 rounded cursor-pointer transition-colors duration-300 hover:bg-red-700" />
                </div>
            </div>
        </section>

    </main>

</body>

</html>
